<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Projects · TraceBase</title>
<link rel="stylesheet" href="css/variables.css" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/layout.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/responsive.css" />
<link rel="stylesheet" href="css/themes.css" />
</head>
<body>
<a href="#page-content" class="skip-link">Skip to content</a>
<div id="app-shell"></div>

<template id="page-content-template">
  <div class="page-header">
    <div>
      <h1>Projects</h1>
      <p class="subtitle">All active and planned projects across your team.</p>
    </div>
    <button class="btn btn-primary" id="new-project-btn">+ New Project</button>
  </div>

  <div class="filter-bar">
    <select class="filter-select" id="status-filter">
      <option value="">Active Projects</option>
      <option value="Planning">Planning</option>
      <option value="Active">Active</option>
      <option value="On Hold">On Hold</option>
      <option value="Completed">Completed</option>
      <option value="Archived">Archived</option>
    </select>
  </div>

  <div id="projects-list"></div>
</template>

<script type="module" src="js/page-projects.js"></script>
</body>
</html>
