<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Settings · TraceBase</title>
<link rel="stylesheet" href="css/variables.css" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/layout.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/responsive.css" />
<link rel="stylesheet" href="css/themes.css" />
</head>
<body>
<a href="#page-content" class="skip-link">Skip to content</a>
<div id="app-shell"></div>

<template id="page-content-template">
  <div class="page-header">
    <div>
      <h1>Settings</h1>
      <p class="subtitle">Your profile, preferences, and application configuration.</p>
    </div>
  </div>

  <div class="tabs">
    <span class="tab active">Profile</span>
    <span class="tab" style="cursor:default;">Preferences</span>
    <span class="tab" style="cursor:default;">Configuration</span>
  </div>

  <div class="panel" style="margin-bottom: var(--space-5);">
    <div class="panel-header"><h3>Profile</h3></div>
    <div class="panel-body" id="profile-settings-body"></div>
  </div>

  <div class="panel" style="margin-bottom: var(--space-5);">
    <div class="panel-header"><h3>Preferences</h3></div>
    <div class="panel-body" id="preferences-body"></div>
  </div>

  <div class="panel" id="admin-config-section">
    <div class="panel-header"><h3>Application Configuration <span class="badge badge-neutral">Admin</span></h3></div>
    <div class="panel-body" id="admin-config-body"></div>
  </div>
</template>

<script type="module" src="js/page-settings.js"></script>
</body>
</html>
