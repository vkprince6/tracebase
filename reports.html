<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Reports · TraceBase</title>
<link rel="stylesheet" href="css/variables.css" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/layout.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/responsive.css" />
<link rel="stylesheet" href="css/themes.css" />
</head>
<body>
<a href="#page-content" class="skip-link">Skip to content</a>
<div id="app-shell"></div>

<template id="page-content-template">
  <div class="page-header">
    <div>
      <h1>Reports</h1>
      <p class="subtitle">Progress, workload, and completion insights.</p>
    </div>
  </div>

  <div class="filter-bar">
    <label style="margin:0; font-size: var(--text-sm); color:var(--text-secondary);">From</label>
    <input type="date" id="date-from" class="filter-select" />
    <label style="margin:0; font-size: var(--text-sm); color:var(--text-secondary);">To</label>
    <input type="date" id="date-to" class="filter-select" />
    <button class="btn btn-primary btn-sm" id="apply-date-filter-btn">Apply</button>
    <button class="btn btn-ghost btn-sm" id="clear-date-filter-btn">Clear</button>
  </div>

  <div id="reports-root"></div>
</template>

<script type="module" src="js/page-reports.js"></script>
</body>
</html>
